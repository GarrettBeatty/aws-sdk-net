name: DevConfig Helper

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  suggest-devconfig:
    if: github.event.label.name == 'devconfig-required'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate DevConfig suggestion
        id: devconfig-manager
        uses: ./.github/actions/devconfig-manager
        with:
          pr-title: ${{ github.event.pull_request.title }}
          pr-number: ${{ github.event.pull_request.number }}
          branch-name: ${{ github.head_ref || github.ref_name }}

      - name: Post DevConfig suggestion comment
        if: steps.devconfig-manager.outputs.devconfig-content
        uses: actions/github-script@v7
        with:
          script: |
            const devConfigContent = '${{ steps.devconfig-manager.outputs.devconfig-content }}';
            const prNumber = ${{ github.event.pull_request.number }};
            
            const commentBody = '## DevConfig File Needed\n\n' +
              'This PR requires a DevConfig file. Here\'s the suggested DevConfig:\n\n' +
              '```json\n' + devConfigContent + '\n```\n\n' +
              '**To add this DevConfig:**\n\n' +
              '1. Create the file `./generator/.DevConfigs/pr-' + prNumber + '.json`\n' +
              '2. Copy the JSON above into the file\n' +
              '3. Commit and push the file to your PR\n\n' +
              'For more information about DevConfig files, see the [DevConfig Files](https://github.com/aws/aws-sdk-net/blob/main/README.md#devconfig-files) section in the README.md.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });
            
            console.log('DevConfig suggestion posted successfully');
