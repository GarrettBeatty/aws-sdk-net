name: DevConfig Validator

on:
  pull_request:
    types: [synchronize, opened, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-devconfig:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      needs_devconfig: ${{ steps.devconfig-manager.outputs.needs-devconfig }}
      has_devconfig: ${{ steps.devconfig-manager.outputs.has-devconfig }}
      devconfig_content: ${{ steps.devconfig-manager.outputs.devconfig-content }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_head_ref: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run DevConfig validation
        id: devconfig-manager
        uses: ./.github/actions/devconfig-manager
        with:
          pr-title: ${{ github.event.pull_request.title }}
          pr-number: ${{ github.event.pull_request.number }}
          branch-name: ${{ github.head_ref || github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if DevConfig required but missing
        if: steps.devconfig-manager.outputs.needs-devconfig == 'true' && steps.devconfig-manager.outputs.has-devconfig == 'false'
        run: |
          echo "❌ DevConfig file is required for this PR but not present."
          echo "Please add the DevConfig file as described in the comment above."
          echo ""
          echo "To resolve this:"
          echo "1. Check the comment posted by the DevConfig Validator"
          echo "2. Create the suggested DevConfig file"
          echo "3. Commit and push the file to your PR"
          exit 1
