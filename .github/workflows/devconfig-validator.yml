name: DevConfig Validator

on:
  pull_request:
    types: [synchronize, opened, reopened, edited]

permissions:
  contents: read

jobs:
  validate-devconfig:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run DevConfig validation
        id: devconfig-manager
        uses: ./.github/actions/devconfig-manager
        with:
          pr-title: ${{ github.event.pull_request.title }}
          pr-number: ${{ github.event.pull_request.number }}
          branch-name: ${{ github.head_ref || github.ref_name }}

      - name: Upload DevConfig results
        uses: actions/upload-artifact@v4
        with:
          name: devconfig-results-${{ github.event.pull_request.number }}
          path: devconfig-results.json
          retention-days: 1
