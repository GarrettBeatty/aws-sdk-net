name: DevConfig Status Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-devconfig:
    runs-on: ubuntu-latest
    steps:
      - name: DevConfig status check
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const prNumber = context.payload.pull_request.number;
            
            console.log(`Checking DevConfig status for PR #${prNumber}`);
            console.log(`PR labels: ${labels.join(', ')}`);
            
            // Check for maintainer override or no DevConfig needed
            if (labels.includes('devconfig-not-needed')) {
              console.log('✅ DevConfig not needed (devconfig-not-needed label found)');
              return;
            }
            
            // Check if DevConfig validation passed
            if (labels.includes('devconfig-complete')) {
              console.log('✅ DevConfig validation passed (devconfig-complete label found)');
              return;
            }
            
            // Check if DevConfig is required but missing/invalid
            if (labels.includes('devconfig-required')) {
              core.setFailed('❌ DevConfig file is required but missing or invalid. Please add or fix your DevConfig file, or ask a maintainer to add the "devconfig-not-needed" label if this PR does not require a DevConfig.');
              return;
            }
            
            // No relevant DevConfig labels found - conservative approach
            core.setFailed('❌ DevConfig status unknown. Waiting for DevConfig validation to complete. If this persists, please ask a maintainer for assistance.');
