name: DevConfig Status Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-devconfig:
    runs-on: ubuntu-latest
    steps:
      - name: DevConfig status check
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const prNumber = context.payload.pull_request.number;
            
            console.log(`Checking DevConfig status for PR #${prNumber}`);
            console.log(`PR labels: ${labels.join(', ')}`);
            
            // Check if DevConfig is complete
            if (labels.includes('devconfig-complete')) {
              console.log('✅ DevConfig validation passed (devconfig-complete label found)');
              return;
            }
            
            // Check for maintainer override - no DevConfig needed
            if (labels.includes('devconfig-not-needed')) {
              console.log('✅ DevConfig not needed (devconfig-not-needed label found)');
              return;
            }
            
            // Fail if neither completion label is present
            core.setFailed('❌ DevConfig status incomplete. This PR must have either "devconfig-complete" or "devconfig-not-needed" label added by a maintainer before it can be merged.');
