name: 'DevConfig Commenter'
description: 'Posts DevConfig comments from workflow run artifacts'
author: 'AWS SDK Team'

inputs:
  workflow-run-id:
    description: 'ID of the workflow run to download artifacts from'
    required: true
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}

runs:
  using: 'node20'
  main: 'dist/index.js'
